groups:
  - name: workhub
    rules:
      - alert: WorkHubDown
        expr: up{job="workhub"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: WorkHub instance {{ $labels.instance }} is down

      - alert: WorkHubHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="workhub",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="workhub"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of WorkHub requests fail with 5xx

      - alert: WorkHubSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="workhub"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WorkHub p95 latency is above 500ms
