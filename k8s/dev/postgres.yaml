# Throwaway PostgreSQL for local clusters (kind / minikube) and the CI smoke test.
# In production use a managed database (e.g. AWS RDS, see workhub-aws-terraform).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: workhub }
            - { name: POSTGRES_USER, value: workhub }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: workhub-db, key: password }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "workhub", "-d", "workhub"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
