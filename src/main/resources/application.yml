spring:
  application:
    name: workhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workhub}
    username: ${DB_USERNAME:workhub}
    password: ${DB_PASSWORD:workhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, Hibernate only validates it
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

workhub:
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # needed for histogram_quantile() latency panels and alerts

springdoc:
  swagger-ui:
    path: /swagger-ui.html
